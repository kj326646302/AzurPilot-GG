name: Sync upstream safely

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-alasgg-features
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GG branch
        uses: actions/checkout@v4
        with:
          ref: alasgg-features
          fetch-depth: 0

      - name: Configure Git and fetch both upstreams
        run: |
          git config user.name "AzurPilot-GG Sync"
          git config user.email "alasgg-sync@users.noreply.github.com"
          git remote add upstream https://github.com/wess09/AzurPilot.git || true
          git remote set-url upstream https://github.com/wess09/AzurPilot.git
          git remote add official https://github.com/LmeSzinc/AzurLaneAutoScript.git || true
          git remote set-url official https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch upstream master --prune
          git fetch official master --prune

      - name: Verify AzurPilot contains latest official ALAS
        run: |
          if ! git merge-base --is-ancestor official/master upstream/master; then
            echo "AzurPilot upstream/master does not yet contain official ALAS master." >&2
            echo "Refusing to publish a branch that silently misses official updates." >&2
            exit 1
          fi
          echo "official ALAS is contained in AzurPilot upstream/master"

      - name: Rebase GG commits onto AzurPilot upstream
        run: git rebase upstream/master

      - name: Validate GG integration and assets
        run: |
          python -m compileall -q module/gg_handler bin/Frida
          python -m py_compile module/daemon/game_manager.py module/handler/login.py
          test -f bin/Lua/Multiplier.lua
          test -f bin/Frida/inject.py
          test -f bin/Frida/remove_hard_limit.js
          ! git grep -nE '^(<<<<<<< |>>>>>>> )'

      - name: Verify container build
        run: docker build --pull -t azurpilot-gg-sync-check -f deploy/docker/Dockerfile .

      - name: Publish only after successful validation
        run: git push --force-with-lease origin HEAD:alasgg-features
